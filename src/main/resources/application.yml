spring:
  application:
    name: TeknoyCart Backend
  config:
    import: optional:classpath:application-local.yml
  mail:
    host: smtp.gmail.com
    port: 465
    username: clarencekirkmc@gmail.com
    password: ${SPRING_MAIL_PASSWORD:YOUR_GMAIL_APP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          ssl:
            enable: true
          socketFactory:
            port: 465
            class: javax.net.ssl.SSLSocketFactory
            fallback: false
  datasource:
    url: jdbc:postgresql://aws-1-ap-southeast-1.pooler.supabase.com:5432/postgres?sslmode=require
    username: postgres.chmtvasbhkbrvydbajnd
    password: ${SPRING_DATASOURCE_PASSWORD:YOUR_DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate # Ensures no overwrite of existing Capstone 1 Supabase tables
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080
  servlet:
    context-path: /api

jwt:
  secret: YOUR_JWT_SUPER_SECRET_KEY_FOR_TEKNOYCART_TOKEN_GENERATION_MINIMUM_256_BITS
  expiration: 86400000 # 24 Hours in milliseconds
